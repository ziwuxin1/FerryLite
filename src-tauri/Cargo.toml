[package]
name = "claude-launcher"
version = "1.4.3"
description = "Ferry — PC / Nikki YAML 配置生成"
authors = ["ziwuxin1"]
edition = "2021"
rust-version = "1.77.2"

# Tauri 2 约定：库名带 _lib 后缀，避免在 Windows 上与二进制同名冲突。
[lib]
name = "claude_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"


# 配置生成核心（纯逻辑 · 同一份实现也编译成 WASM 给网页版用）。
# serde_yaml 随核心逻辑一起迁到 ferry-core，这里不再直接依赖。
ferry-core = { path = "../ferry-core" }

[profile.release]
panic = "abort"     # 减小体积
codegen-units = 1
lto = true
opt-level = "s"     # 体积优先，贴近设计「~10MB 级」目标
strip = true
