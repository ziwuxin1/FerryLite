name: build-windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: npm install

      # 生成源图标 → 产出完整图标集（icons/ 不入库）。
      - name: Generate icons
        run: |
          node scripts/gen-icon.mjs
          npx tauri icon src-tauri/app-icon.png

      # 先产出 dist（generate_context! 需要 frontendDist 存在才能编译 Rust）。
      - name: Build frontend
        run: npm run build

      - name: Rust unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --no-fail-fast

      - name: Build portable Tauri app (no installer)
        run: npm run tauri build

      - name: Upload portable exe (免安装)
        uses: actions/upload-artifact@v4
        with:
          name: claude-launcher-portable-exe
          path: src-tauri/target/release/claude-launcher.exe
          if-no-files-found: error
