# ========================
# Ferry · 纯回国配置（带注入锚点）
# ========================
#
# 【纯回国模式专用模板】人在国外：国内网站 / App 走「回国机场」的中国出口节点，其余一律直连。
# 已去掉所有翻墙地区组（香港 / 台湾 / 日本 / 韩国 / 美国 / 独立IP…），只保留回国相关组。
# 主要给 OpenClash（mihomo / Meta 内核）用；若 OpenClash 自管 DNS/TUN，则以 OpenClash 设置为准。
# 生成器按 3 个文本锚点注入：机场列表 / 各国内 App 策略组 / 各国内 App 规则。

# 机场节点订阅（回国机场，由生成器按机场列表注入）

proxy-providers:
  # <<INJECT_PROXY_PROVIDERS>>

proxies:
  - {name: 直连, type: direct}
  - {name: 拒绝, type: reject}

# ========================
# 主要端口设置
# ========================
port: 7890
socks-port: 7891
redir-port: 7892
mixed-port: 7893
tproxy-port: 7895

allow-lan: true
mode: rule
log-level: info

external-controller: 0.0.0.0:9090
external-ui: ui
external-ui-name: zashboard
external-ui-url: https://gh-proxy.com/github.com/Zephyruso/zashboard/archive/refs/heads/gh-pages.zip
secret: "123456"

# ========================
# DNS（防污染：国内域名走国内 DNS、国外域名走国外 DNS）
# ========================
dns:
  enable: true
  listen: 0.0.0.0:7874
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.20.0.1/16
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - +.lan
    - +.local
    - geosite:cn
  nameserver:
    - 223.5.5.5
    - 119.29.29.29
  fallback:
    - 1.1.1.1
    - 8.8.8.8
  fallback-filter:
    geoip: true
    geoip-code: CN

ipv6: false

# ========================
# TUN 模块
# ========================
tun:
  enable: true
  stack: gvisor
  device: utun
  endpoint-independent-nat: true
  auto-route: true
  auto-detect-interface: true
  auto-redirect: false
  strict-route: false

profile:
  store-selected: true
  store-fake-ip: true

# ========================
# 策略组（纯回国：仅保留回国相关组）
# ========================
proxy-groups:
  # 主切换：默认走「回国-自动」；某 App 在回国节点上不行时，可切「所有-自动 / 直连」。
  - {name: 回国, type: select, icon: "https://gh-proxy.com/raw.githubusercontent.com/lipis/flag-icons/main/flags/4x3/cn.svg", proxies: [回国-自动, 所有-自动, 直连, 拒绝]}
  # 傻瓜式分流：每个启用的国内 App 一个独立 select 组（组名=APP 名），在 zashboard 里逐个切换出口。
  # <<INJECT_SPLIT_GROUPS>>
  # 自动测速选最快的中国出口节点。测速 URL 用百度：回国节点在中国境内连不上 Google 的 generate_204，会被误判成死节点。
  - {name: 回国-自动, icon: "https://gh-proxy.com/raw.githubusercontent.com/lipis/flag-icons/main/flags/4x3/cn.svg", type: url-test, include-all: true, tolerance: 50, interval: 300, url: "http://www.baidu.com", filter: "(?i)(回国|国内|大陆|IPLC|IEPL|cn2|back|home|china|电信|联通|移动|上海|北京|广州|深圳|杭州)", exclude-filter: "(?i)(香港|HK|台湾|TW|日本|JP|新加坡|SG|韩国|KR|美国|US|独立)"}
  # 兜底：万一上面 filter 没匹配到回国节点（机场节点命名不含上述关键词），这里能选机场里所有节点。
  - {name: 所有-自动, icon: "https://gh-proxy.com/raw.githubusercontent.com/lipis/flag-icons/main/flags/4x3/un.svg", type: url-test, include-all: true, tolerance: 50, interval: 300, url: "http://www.baidu.com"}

# ========================
# 规则引擎（国内 → 回国；其余 → 直连）
# ========================
rules:
  # 本地 / 局域网直连（路由器场景必需）
  - IP-CIDR,192.168.0.0/16,直连,no-resolve
  - IP-CIDR,10.0.0.0/8,直连,no-resolve
  - IP-CIDR,172.16.0.0/12,直连,no-resolve
  - IP-CIDR,127.0.0.0/8,直连,no-resolve
  - RULE-SET,Private / Domain,直连
  # 各启用国内 App（指向各自的回国组；排在 China 兜底之前，先命中）
  # <<INJECT_SPLIT_RULES>>
  # 全部国内网站 → 回国（geosite CN + GeoIP CN）
  - RULE-SET,China / Domain,回国
  - RULE-SET,China / IP,回国,no-resolve
  # 其余（国外）一律直连
  - MATCH,直连

# ========================
# 规则集提供者
# ========================
rule-anchor:
  ip: &ip {type: http, interval: 86400, behavior: ipcidr, format: mrs}
  domain: &domain {type: http, interval: 86400, behavior: domain, format: mrs}

rule-providers:
  China / Domain: {<<: *domain, url: "https://gh-proxy.com/github.com/metacubex/meta-rules-dat/raw/refs/heads/meta/geo/geosite/cn.mrs"}
  China / IP: {<<: *ip, url: "https://gh-proxy.com/github.com/metacubex/meta-rules-dat/raw/refs/heads/meta/geo/geoip/cn.mrs"}
  Private / Domain: {<<: *domain, url: "https://gh-proxy.com/github.com/metacubex/meta-rules-dat/raw/refs/heads/meta/geo/geosite/private.mrs"}
