# ========================
# Clash-ALL 优化配置
# ========================
#
# 【本文件是「带注入锚点」的模板，由 Claude 一键启动器内置（include_str! 编译进 exe）。】
# 配置生成器按 4 个文本锚点做「文本注入」，绝不 load→dump（会丢注释与 YAML 锚点）：
#   1. 机场列表    —— proxy-providers 段（可注入多个机场，各含名字 + 订阅 URL）
#   2. 独立 IP 节点  —— proxies 段「拒绝」之后的锚点注释
#   3. Claude 策略组 —— proxy-groups 里 Claude 行处的锚点注释
#   4. 验证回显规则  —— rules 段 MATCH,其他 之前的锚点注释
# 原始基底：MAXs_20260609_01.yaml（老师模板），除上述 4 处外保持原样。

# 机场节点订阅（可多个，由生成器按机场列表注入）

proxy-providers:
  # <<INJECT_PROXY_PROVIDERS>>

proxies:
  - {name: 直连, type: direct}
  - {name: 拒绝, type: reject}
  # <<INJECT_PROXY_NODE>>

# ========================
# 主要端口设置
# ========================
port: 7890
socks-port: 7891
redir-port: 7892
mixed-port: 7893
tproxy-port: 7895

allow-lan: true
mode: rule
log-level: info

external-controller: 0.0.0.0:9090
external-ui: ui
external-ui-name: zashboard
external-ui-url: https://gh-proxy.com/github.com/Zephyruso/zashboard/archive/refs/heads/gh-pages.zip
secret: "123456"

# ========================
# DNS 设置
# ========================
dns:
  enable: true
  listen: 0.0.0.0:7874
  ipv6: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.20.0.1/16
  nameserver:
    - 223.5.5.5
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - +.lan
    - +.local
    - geosite:cn
# 快猫
    - +.km688.ink
# 火烧
    - +.onesubv.site
    - +.oneyyds.online
    - +.fengyyds.site
    - +.onemg.top
# 猫耳
    - +.chybinc.com
# BestVPN
    - +.invitevp.com
    - +.vp2.us
# 小牛
    - +.xiaoniuyun.cc
# 硅谷
    - +.apple-bing.sbs
# 无界
    - +.bncrcloud.com
# 冰云
    - +.xby01.xyz
# 牛逼
    - +.idsduf.com
    - +.66jc.top
# 极速通
    - +.gfw.gg
# 萌狗
    - +.moedog.cloud

# 其他
    - +.ynhtbank.com
    - +.qeayr.cn
    - +.saojc.xyz
    - +.sssyun.xyz
    - +.dler.cloud
    - +.0tk8a3a1q4t94dler.com
    - +.aerianas.top
    - +.gptacg.top
    - +.wxda.net

ipv6: true

# ========================
# TUN 模块
# ========================
tun:
  enable: true
  stack: gvisor
  device: utun
  endpoint-independent-nat: true
  auto-route: true
  auto-detect-interface: true
  auto-redirect: false
  strict-route: false

profile:
  store-selected: true
  store-fake-ip: true

# ========================
# 策略组定义
# ========================
default: &default
  type: select
  proxies: [直连,所有-手动,所有-自动,香港-自动,台湾-自动,日本-自动,新加坡-自动,韩国-自动,美国-自动,美国独立IP,其他-自动,拒绝]

proxy-groups:
  # <<CLAUDE_GROUP>>
  # 傻瓜式分流：每个启用的 APP 一个独立 select 组（组名=APP 名），用户在 zashboard 里逐个切换出口。
  # <<INJECT_SPLIT_GROUPS>>
  - {name: Test, <<: *default, proxies: [美国独立IP,直连,所有-手动,所有-自动,香港-自动,台湾-自动,日本-自动,新加坡-自动,韩国-自动,美国-自动,其他-自动,拒绝]}
  - {name: 国外, <<: *default, icon: "https://gh-proxy.com/raw.githubusercontent.com/lipis/flag-icons/main/flags/4x3/un.svg", proxies: [香港-自动,直连,所有-手动,所有-自动,台湾-自动,日本-自动,新加坡-自动,韩国-自动,美国-自动,美国独立IP,其他-自动,拒绝]}
  - {name: 国内, <<: *default, icon: "https://gh-proxy.com/raw.githubusercontent.com/lipis/flag-icons/main/flags/4x3/cn.svg"}
  - {name: 其他, <<: *default, icon: "https://gh-proxy.com/raw.githubusercontent.com/lipis/flag-icons/main/flags/4x3/un.svg", proxies: [香港-自动,直连,所有-手动,所有-自动,台湾-自动,日本-自动,新加坡-自动,韩国-自动,美国-自动,美国独立IP,其他-自动,拒绝]}
  - {name: 所有-手动, icon: "https://gh-proxy.com/raw.githubusercontent.com/lipis/flag-icons/main/flags/4x3/un.svg", type: select, include-all: true, filter: "^((?!(直连|拒绝)).)*$", exclude-filter: "独立"}
  - {name: 所有-自动, icon: "https://gh-proxy.com/raw.githubusercontent.com/lipis/flag-icons/main/flags/4x3/un.svg", type: url-test, include-all: true, tolerance: 50, interval: 300, filter: "^((?!(直连|拒绝)).)*$", exclude-filter: "独立"}
  - {name: 香港-自动, icon: "https://gh-proxy.com/raw.githubusercontent.com/lipis/flag-icons/main/flags/4x3/hk.svg", type: url-test, include-all: true, tolerance: 50, interval: 300, filter: "(?=.*(广港|香港|HK|Hong Kong|🇭🇰|HongKong)).*$"}
  - {name: 台湾-自动, icon: "https://gh-proxy.com/raw.githubusercontent.com/lipis/flag-icons/main/flags/4x3/tw.svg", type: url-test, include-all: true, tolerance: 50, interval: 300, filter: "(?=.*(广台|台湾|台灣|TW|Tai Wan|🇹🇼|🇨🇳|TaiWan|Taiwan)).*$"}
  - {name: 日本-自动, icon: "https://gh-proxy.com/raw.githubusercontent.com/lipis/flag-icons/main/flags/4x3/jp.svg", type: url-test, include-all: true, tolerance: 50, interval: 300, filter: "(?=.*(广日|日本|JP|川日|东京|大阪|泉日|埼玉|沪日|深日|🇯🇵|Japan)).*$"}
  - {name: 新加坡-自动, icon: "https://gh-proxy.com/raw.githubusercontent.com/lipis/flag-icons/main/flags/4x3/sg.svg", type: url-test, include-all: true, tolerance: 50, interval: 300, filter: "(?=.*(广新|新加坡|SG|坡|狮城|🇸🇬|Singapore)).*$"}
  - {name: 韩国-自动, icon: "https://gh-proxy.com/raw.githubusercontent.com/lipis/flag-icons/main/flags/4x3/kr.svg", type: url-test, include-all: true, tolerance: 50, interval: 300, filter: "(?=.*(广韩|韩国|韓國|KR|首尔|春川|🇰🇷|Korea)).*$"}
  - {name: 美国-自动, icon: "https://gh-proxy.com/raw.githubusercontent.com/lipis/flag-icons/main/flags/4x3/us.svg", type: url-test, include-all: true, tolerance: 50, interval: 300, filter: "(?=.*(广美|US|美国|纽约|波特兰|达拉斯|俄勒|凤凰城|费利蒙|洛杉|圣何塞|圣克拉|西雅|芝加|🇺🇸|United States)).*$", exclude-filter: "独立"}
  # 中转跳专用：排除 hy2/tuic/wg/reality/shadowtls（dialer-proxy 不能用 UDP/伪装协议当中转，否则 socks5 不链接、从机场节点漏出）。只挑 TCP 美国节点。
  - {name: 美国-中转, icon: "https://gh-proxy.com/raw.githubusercontent.com/lipis/flag-icons/main/flags/4x3/us.svg", type: url-test, include-all: true, tolerance: 50, interval: 300, filter: "(?=.*(广美|US|美国|纽约|波特兰|达拉斯|俄勒|凤凰城|费利蒙|洛杉|圣何塞|圣克拉|西雅|芝加|🇺🇸|United States)).*$", exclude-filter: "(?i)(独立|hy2|hysteria|tuic|wireguard|reality|shadowtls|udp)"}
  - {name: 其他-自动, icon: "https://gh-proxy.com/raw.githubusercontent.com/lipis/flag-icons/main/flags/4x3/un.svg", type: url-test, include-all: true, tolerance: 50, interval: 300, filter: "^((?!(直连|拒绝|广港|香港|HK|Hong Kong|🇭🇰|HongKong|广台|台湾|台灣|TW|Tai Wan|🇹🇼|🇨🇳|TaiWan|Taiwan|广日|日本|JP|川日|东京|大阪|泉日|埼玉|沪日|深日|🇯🇵|Japan|广新|新加坡|SG|坡|狮城|🇸🇬|Singapore|广韩|韩国|韓國|KR|首尔|春川|🇰🇷|Korea|广美|US|美国|纽约|波特兰|达拉斯|俄勒|凤凰城|费利蒙|洛杉|圣何塞|圣克拉|西雅|芝加|🇺🇸|United States|英国|UK)).)*$"}

# ========================
# 规则引擎（rules）
# ========================
rules:
  # <<INJECT_TOP_RULES>>
  # <<INJECT_SPLIT_RULES>>
  # Claude 规则提到最前（在 TEST/Check 之前）：确保 Claude 域名永远优先走 Claude 组→独立IP，绝不被 Check.list 抢去机场。
  - RULE-SET,Claude / Domain,Claude
  - RULE-SET,TEST / Domain,Test
  # 分流规则已按「每个 APP 独立策略组」在上方生成；此处仅保留 Claude / 测试 / 兜底。
  - RULE-SET,Proxy / Domain,国外
  - RULE-SET,Globe / Domain,国外
  - RULE-SET,Direct / Domain,国内
  - RULE-SET,China / Domain,国内
  - RULE-SET,China / IP,国内,no-resolve
  - RULE-SET,Private / Domain,国内
  # <<INJECT_VERIFY_RULES>>
  - MATCH,其他

