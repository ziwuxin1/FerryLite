[package]
name = "ferry-core"
version = "1.5.0"
description = "Ferry 配置生成核心 —— 纯逻辑（无文件 / 网络 / 进程 IO），桌面版与网页版(WASM)共用同一份实现"
authors = ["ziwuxin1"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "ferry_core"

[dependencies]
serde = { version = "1", features = ["derive"] }
# 仅用于「注入后语法体检」，绝不 load→dump（会丢注释与锚点）。
serde_yaml = "0.9"
