# ========================
# Ferry · 纯回国配置（带注入锚点）
# ========================
#
# 【纯回国模式专用模板】人在国外：国内网站 / App 走「回国机场」的中国出口节点，其余一律直连。
# 已去掉所有翻墙地区组（香港 / 台湾 / 日本 / 韩国 / 美国 / 独立IP…），只保留回国相关组。
# 主要给 OpenClash（mihomo / Meta 内核）用；若 OpenClash 自管 DNS/TUN，则以 OpenClash 设置为准。
# 生成器按 3 个文本锚点注入：机场列表 / 各国内 App 策略组 / 各国内 App 规则。

# 机场节点订阅（回国机场，由生成器按机场列表注入）

proxy-providers:
  # <<INJECT_PROXY_PROVIDERS>>

proxies:
  - {name: 直连, type: direct}
  - {name: 拒绝, type: reject}

# ========================
# 主要端口设置
# ========================
port: 7890
socks-port: 7891
redir-port: 7892
mixed-port: 7893
tproxy-port: 7895

allow-lan: true
mode: rule
log-level: info

external-controller: 0.0.0.0:9090
external-ui: ui
external-ui-name: zashboard
external-ui-url: https://gh-proxy.com/github.com/Zephyruso/zashboard/archive/refs/heads/gh-pages.zip
secret: "123456"

# ========================
# DNS（防污染：国内域名走国内 DNS、国外域名走国外 DNS）
# ========================
dns:
  enable: true
  listen: 0.0.0.0:7874
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.20.0.1/16
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - +.lan
    - +.local
    - geosite:cn
  nameserver:
    - 223.5.5.5
    - 119.29.29.29
  fallback:
    - 1.1.1.1
    - 8.8.8.8
  fallback-filter:
    geoip: true
    geoip-code: CN

ipv6: false

# ========================
# TUN 模块
# ========================
tun:
  enable: true
  stack: gvisor
  device: utun
  endpoint-independent-nat: true
  auto-route: true
  auto-detect-interface: true
  auto-redirect: false
  strict-route: false

profile:
  store-selected: true
  store-fake-ip: true

# ========================
# 策略组（纯回国：仅保留回国相关组）
# ========================
proxy-groups:
  # 主切换：默认走「回国-自动」；某 App 在回国节点上不行时，可切「所有-自动 / 直连」。
  - {name: 回国, type: select, icon: "https://gh-proxy.com/raw.githubusercontent.com/lipis/flag-icons/main/flags/4x3/cn.svg", proxies: [回国-自动, 所有-自动, 所有-手动, 直连, 拒绝]}
  # Test：手动测线路用 —— 测试域名规则集指到这里，可切不同出口验证某条线路通不通。
  - {name: Test, type: select, proxies: [回国-自动, 所有-自动, 所有-手动, 直连, 拒绝]}
  # 傻瓜式分流：每个启用的国内 App 一个独立 select 组（组名=APP 名），在 zashboard 里逐个切换出口。
  # <<INJECT_SPLIT_GROUPS>>
  # 自动测速选最快的回国节点。回国机场是专线，整个机场都是回国节点 → include-all 全收，不按「回国/电信」关键词筛
  # （回国机场常按「接入国家」命名，如「US 美国中转 / JP 日本中转」，落地都在中国；按关键词筛反而误杀这些节点）。
  # filter 仅排除 直连/拒绝：include-all 会把 proxies 段的 直连/拒绝 也收进来，不排掉的话 url-test 会挑到延迟最低的「直连」（等于没走回国）。
  # 测速 URL 用百度：回国节点在中国境内连不上 Google 的 generate_204，会被误判成死节点。
  - {name: 回国-自动, icon: "https://gh-proxy.com/raw.githubusercontent.com/lipis/flag-icons/main/flags/4x3/cn.svg", type: url-test, include-all: true, tolerance: 50, interval: 300, url: "http://www.baidu.com", filter: "^((?!(直连|拒绝)).)*$"}
  # 备选：同样全收机场节点（排除 直连/拒绝），可手动从这里挑具体入口。
  - {name: 所有-自动, icon: "https://gh-proxy.com/raw.githubusercontent.com/lipis/flag-icons/main/flags/4x3/un.svg", type: url-test, include-all: true, tolerance: 50, interval: 300, url: "http://www.baidu.com", filter: "^((?!(直连|拒绝)).)*$"}
  # 手动选节点：列出机场全部节点供逐个手选。找 B站番剧能用的大陆出口节点时用：把「回国」切到这里、挨个点节点试番剧，配合 Test 组看出口 IP 是不是大陆。
  - {name: 所有-手动, icon: "https://gh-proxy.com/raw.githubusercontent.com/lipis/flag-icons/main/flags/4x3/un.svg", type: select, include-all: true, filter: "^((?!(直连|拒绝)).)*$"}

# ========================
# 规则引擎（国内 → 回国；其余 → 直连）
# ========================
rules:
  # 本地 / 局域网直连（路由器场景必需）
  - IP-CIDR,192.168.0.0/16,直连,no-resolve
  - IP-CIDR,10.0.0.0/8,直连,no-resolve
  - IP-CIDR,172.16.0.0/12,直连,no-resolve
  - IP-CIDR,127.0.0.0/8,直连,no-resolve
  - RULE-SET,Private / Domain,直连
  # 测试域名 → Test（手动测线路用）
  - RULE-SET,TEST / Domain,Test
  # ==== 拦 B站 QUIC（UDP 443）→ 逼 B站走 TCP（经回国/台湾节点）====
  # B站 App 启动会用 QUIC 直连做地区检查，QUIC 绕过 TCP 代理 → 启动泄漏真实 IP → 番剧锁区（重启 App 复现）。
  # 拦掉 B站 UDP，App 自动回退 TCP，启动地区检查也稳定走代理节点 → 重启也能稳定解锁。
  - AND,((NETWORK,UDP),(DOMAIN-SUFFIX,bilibili.com)),REJECT-DROP
  - AND,((NETWORK,UDP),(DOMAIN-SUFFIX,biliapi.net)),REJECT-DROP
  - AND,((NETWORK,UDP),(DOMAIN-SUFFIX,biliapi.com)),REJECT-DROP
  - AND,((NETWORK,UDP),(DOMAIN-SUFFIX,bilivideo.com)),REJECT-DROP
  - AND,((NETWORK,UDP),(DOMAIN-SUFFIX,bilivideo.cn)),REJECT-DROP
  - AND,((NETWORK,UDP),(DOMAIN-SUFFIX,hdslb.com)),REJECT-DROP
  - AND,((NETWORK,UDP),(DOMAIN-SUFFIX,acgvideo.com)),REJECT-DROP
  # ==== FakeLocation（IP 归属地修正，来源 Accademia/Additional_Rule_For_Clash）====
  # 拦 httpdns/分析：国内 App 自带 HTTPDNS 会连硬编码 IP 直接解析、绕过分流→暴露你的海外 IP（发评论显示美国）。
  # REJECT-DROP 掉这些，逼 App 回退正常 DNS → 走下面的回国路由。
  - IP-CIDR,47.101.175.206/32,REJECT-DROP,no-resolve
  - IP-CIDR,47.100.123.169/32,REJECT-DROP,no-resolve
  - IP-CIDR,120.46.169.234/32,REJECT-DROP,no-resolve
