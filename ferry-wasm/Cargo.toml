[package]
name = "ferry-wasm"
version = "1.4.3"
description = "ferry-core 的 WASM 包装 —— 给网页版用，不含任何业务逻辑"
authors = ["ziwuxin1"]
edition = "2021"
rust-version = "1.77.2"

[lib]
crate-type = ["cdylib", "rlib"]

# wasm-pack 自带的 binaryen 比 rustc 1.95 旧：新版 rustc 默认发 bulk-memory 等指令，
# 旧 wasm-opt 不认会直接 validate 失败。这里显式打开对应 feature，保留体积优化。
[package.metadata.wasm-pack.profile.release]
wasm-opt = [
  "-O",
  "--enable-bulk-memory",
  "--enable-nontrapping-float-to-int",
  "--enable-sign-ext",
  "--enable-mutable-globals",
  "--enable-reference-types",
]

[dependencies]
ferry-core = { path = "../ferry-core" }
wasm-bindgen = "0.2"
serde_json = "1"

[profile.release]
opt-level = "z"   # wasm 体积优先
lto = true
codegen-units = 1
panic = "abort"
strip = true
